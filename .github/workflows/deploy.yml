name: Auto Deploy to Hostinger VPS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            echo "🚀 Canlı Site Güncelleniyor..."
            cd /var/www/bluuryajans.com
            
            # backend/.env artık git'te takip edilmiyor: pull sırasında silinmemesi için yedekle ve geri yükle
            cp backend/.env "$HOME/bluury-backend.env.bak" 2>/dev/null || true

            # Olası çakışmaları önleyip en güncel kodları çek
            git stash
            git pull origin main

            [ -f backend/.env ] || cp "$HOME/bluury-backend.env.bak" backend/.env
            chmod 600 backend/.env
            
            # Backend ve Veritabanı Güncellemesi
            cd backend
            npm install --production=false
            npx prisma generate
            npx prisma db push
            
            # Backend Servisini Yeniden Başlat (PM2)
            cd /var/www/bluuryajans.com
            pm2 restart bluury-backend || pm2 start ecosystem.config.js --env production
            pm2 save
            
            # Frontend Derlemesi (Build)
            npm install
            npm run build

            # Nginx Yapılandırmasını Senkronize Et ve Yeniden Yükle
            cp /var/www/bluuryajans.com/bluuryajans.nginx.conf /etc/nginx/sites-available/bluuryajans.com
            nginx -t && systemctl reload nginx
            
            echo "🎉 Tebrikler! blurryajans.com başarıyla güncellendi ve yayında!"
