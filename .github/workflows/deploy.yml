name: Deploy to Hostinger VPS (Production & Staging)

on:
  push:
    branches: [ "main", "staging" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            if [ "${{ github.ref }}" = "refs/heads/staging" ]; then
              echo "🚀 Staging ortamı güncelleniyor..."
              cd /var/www/bluuryajans-staging
              git pull origin staging
              
              cd backend
              npm install --production=false
              npx prisma generate
              npx prisma db push
              
              cd ..
              pm2 restart bluury-staging || pm2 start backend/server.js --name bluury-staging --env production -- 5001
              pm2 save
              
              npm install
              npm run build
              echo "✅ Staging başarıyla güncellendi -> https://staging.blurryajans.com"
            else
              echo "🌟 Canlı (Production) ortamı güncelleniyor..."
              cd /var/www/bluuryajans.com
              git pull origin main
              
              cd backend
              npm install --production=false
              npx prisma generate
              npx prisma db push
              
              cd ..
              pm2 restart bluury-backend || pm2 start ecosystem.config.js --name bluury-backend --env production
              pm2 save
              
              npm install
              npm run build
              echo "✅ Canlı Site başarıyla güncellendi -> https://blurryajans.com"
            fi
