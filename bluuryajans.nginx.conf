# HTTP → HTTPS yönlendirmesi (tüm varyantlar ve tüm sayfalar 301 kalıcı yönlendirme ile HTTPS'e yönlendirilir)
server {
    listen 80;
    listen [::]:80;
    server_name blurryajans.com www.blurryajans.com bluuryajans.com www.bluuryajans.com;

    return 301 https://blurryajans.com$request_uri;
}

# www.blurryajans.com, bluuryajans.com, www.bluuryajans.com → blurryajans.com (HTTPS 301 Kalıcı Canonical Yönlendirmesi)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.blurryajans.com bluuryajans.com www.bluuryajans.com;

    ssl_certificate /etc/letsencrypt/live/blurryajans.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blurryajans.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://blurryajans.com$request_uri;
}

# Ana HTTPS Sunucusu: https://blurryajans.com
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name blurryajans.com;

    ssl_certificate /etc/letsencrypt/live/blurryajans.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blurryajans.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100M;

    # Güvenlik ve SEO HTTP Başlıkları
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/bluuryajans.com/dist;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # robots.txt - arama motorları her zaman en güncel halini görsün
    location = /robots.txt {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # sitemap.xml - site haritası
    location = /sitemap.xml {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # SPA Statik HTML Ön-Derlenmiş (Pre-rendered) Rotaları:
    # Her sayfanın kendi özel meta etiketleri, H1/H2 başlıkları ve JSON-LD şeması için dist/<rota>/index.html sunulur
    location ~ ^/(hizmetler|portfolyo|hakkimizda|iletisim|kvkk-aydinlatma-metni|acik-riza-metni|cerez-politikasi|gizlilik-politikasi|kunye)$ {
        try_files $uri/index.html /index.html =404;
    }

    # Kullanıcı veya bot yanlışlıkla sonuna slash koyarak gelirse, standart canonical URL'ye 301 ile yönlendir
    location ~ ^/(hizmetler|portfolyo|hakkimizda|iletisim|kvkk-aydinlatma-metni|acik-riza-metni|cerez-politikasi|gizlilik-politikasi|kunye)/$ {
        return 301 https://blurryajans.com/$1;
    }

    # Admin ve diğer alt rotalarda sondaki eğik çizgiyi temizle
    location ~ ^/(.+)/$ {
        return 301 https://blurryajans.com/$1;
    }

    # Bilinmeyen adresler gerçek 404 döner (soft 404 yok): HTTP kodu 404 kalır,
    # gövde olarak index.html sunulur ve React'teki NotFound ekranı görünür.
    error_page 404 /index.html;

    # Ana sayfa
    location = / {
        try_files /index.html =404;
    }

    # Yönetim paneli (React Router istemci rotaları: /admin, /admin/login, /admin/dashboard/*)
    location = /admin {
        try_files /index.html =404;
    }
    location ^~ /admin/ {
        try_files $uri /index.html;
    }

    # Diğer her şey: dosya varsa sunulur, yoksa gerçek 404
    location / {
        try_files $uri =404;
    }

    # Yüklenen görseller ve medya dosyaları
    location ^~ /uploads/ {
        alias /var/www/bluuryajans.com/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Backend Express API Yönlendirmesi
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Statik Varlıklar (Önbellekleme)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|webp|svg|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}