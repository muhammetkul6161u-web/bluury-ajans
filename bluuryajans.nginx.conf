# /etc/nginx/sites-available/bluuryajans.com
# Bluury Ajans — Hostinger VPS Nginx Reverse Proxy & Static Site Config

server {
    listen 80;
    listen [::]:80;
    server_name bluuryajans.com www.bluuryajans.com;

    # Yüksek boyutlu fotoğraf ve video yüklemelerine izin ver
    client_max_body_size 100M;

    # Frontend Statik Dosyaları (Vite Build)
    root /var/www/bluuryajans.com/dist;
    index index.html;

    # Gzip Sıkıştırma (Hız Optimizasyonu)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # 1. Frontend SPA Yönlendirmesi (React Router için)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Statik Medya Dosyaları (/uploads -> Backend Uploads Klasörü)
    location /uploads/ {
        alias /var/www/bluuryajans.com/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # 3. Backend Express API Reverse Proxy (Port 5000)
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Zaman aşımı süreleri (Büyük video yüklemeleri için)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Statik assetler için uzun süreli cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|webp|svg|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
