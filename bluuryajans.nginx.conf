# HTTP → HTTPS yönlendirmesi (tüm varyantlar ve tüm sayfalar 301 kalıcı yönlendirme ile HTTPS'e yönlendirilir)
server {
    listen 80;
    listen [::]:80;
    server_name blurryajans.com www.blurryajans.com bluuryajans.com www.bluuryajans.com;

    return 301 https://blurryajans.com$request_uri;
}

# www.blurryajans.com → blurryajans.com (HTTPS 301 Kalıcı Canonical Yönlendirmesi)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.blurryajans.com;

    ssl_certificate /etc/letsencrypt/live/blurryajans.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blurryajans.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://blurryajans.com$request_uri;
}

# Ana HTTPS Sunucusu: https://blurryajans.com
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name blurryajans.com;

    ssl_certificate /etc/letsencrypt/live/blurryajans.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blurryajans.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100M;

    root /var/www/bluuryajans.com/dist;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json image/svg+xml;

    # robots.txt - arama motorları her zaman en güncel halini görsün
    location = /robots.txt {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # sitemap.xml - site haritası
    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # SPA Yönlendirmesi (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Yüklenen görseller ve medya dosyaları
    location /uploads/ {
        alias /var/www/bluuryajans.com/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Backend Express API Yönlendirmesi
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Statik Varlıklar (Önbellekleme)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|webp|svg|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}